// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate { project ->
        tasks.matching { it.name.toLowerCase().contains("extract") && it.name.toLowerCase().contains("annotations") }.configureEach {
            enabled = false
        }
        tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach {
            enabled = false
        }
        try {
            def debugDir = file("${project.layout.buildDirectory.get()}/intermediates/annotations_typedef_file/debug/extractDebugAnnotations")
            def releaseDir = file("${project.layout.buildDirectory.get()}/intermediates/annotations_typedef_file/release/extractReleaseAnnotations")
            debugDir.mkdirs()
            releaseDir.mkdirs()
            file("${debugDir}/typedefs.txt").createNewFile()
            file("${releaseDir}/typedefs.txt").createNewFile()
        } catch (Exception e) {}

        def createTypedefs = project.tasks.register("createTypedefs") {
            doLast {
                def debugDir = file("${project.layout.buildDirectory.get()}/intermediates/annotations_typedef_file/debug/extractDebugAnnotations")
                def releaseDir = file("${project.layout.buildDirectory.get()}/intermediates/annotations_typedef_file/release/extractReleaseAnnotations")
                debugDir.mkdirs()
                releaseDir.mkdirs()
                file("${debugDir}/typedefs.txt").createNewFile()
                file("${releaseDir}/typedefs.txt").createNewFile()
            }
        }
        tasks.matching { it.name.startsWith("sync") && it.name.endsWith("LibJars") }.configureEach {
            dependsOn createTypedefs
        }
    }
}
